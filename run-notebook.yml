name: Run notebook

# Runs the notebook from top to bottom on every push, so a broken input file or a
# failing check shows up here before anyone else sees it.
on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt nbconvert ipykernel
      - run: jupyter nbconvert --to notebook --execute SBSZ01_Colab.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=300
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            executed.ipynb
            SBSZ01_results.zip
